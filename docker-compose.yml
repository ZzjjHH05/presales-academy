# 售前学院 · 生产部署（方案 B：香港服务器 Docker，当前主路线）
# 用法：先配好 .env（cp .env.example .env，填 NEXT_PUBLIC_SITE_URL，AI Key 到 Phase 4 再填），
#       确认 Caddyfile 域名已替换，然后 docker compose up -d --build
services:
  app:
    build:
      context: .
      args:
        # 构建期注入：sitemap / OG 卡片是 build 时静态生成的，需要正式域名
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    env_file:
      - path: .env
        required: false # 缺失也能起（本地 file 数据库模式），但建议配置；AI Key（Phase 4 起）从这里进容器
    restart: unless-stopped
    # 日志上限：防止单机磁盘被日志撑满（可用性保障）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3000"
    volumes:
      - ./data:/app/data   # SQLite 持久化（换浏览器登录进度仍在）

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"      # HTTP（自动跳转 HTTPS）
      - "443:443"    # HTTPS（Caddy 自动签发 Let's Encrypt 证书）
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
